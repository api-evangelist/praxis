aid: praxis
name: Praxis
description: 'Praxis is a New York-based company building an internet-native community
  and city-development venture — "an online community starting a new city" — founded
  in 2019 by Dryden Brown and Charlie Callinan. It operates a membership community
  at praxisnation.com whose stated purpose is to create a new culture and a resident-owned
  physical city, and a members-only account portal at portal.praxisnation.com where
  members view their PRAX holdings and manage their account. In October 2024 Praxis
  announced $525M in financing toward development of its first city. Praxis is a real-estate,
  community and smart-cities company, not a software vendor: it publishes no developer
  program, no API documentation, and no machine-readable API contract on any host it
  controls.'
